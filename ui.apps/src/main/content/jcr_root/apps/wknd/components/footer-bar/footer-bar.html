<div data-sly-use.footerBar="com.adobe.aem.guides.wknd.core.models.FooterBar"
     data-sly-use.placeholderTemplate="core/wcm/components/commons/v1/templates.html"
     data-sly-test.hasContent="${!footerBar.empty}"
     class="cmp-footer-bar">

    <p data-sly-test="${footerBar.title}" class="cmp-footer-bar__title">${footerBar.title @ context='text'}</p>

    <nav class="cmp-footer-bar__nav" aria-label="${footerBar.title @ i18n}">
        <ul class="cmp-footer-bar__nav-list">
            <li data-sly-repeat.link="${footerBar.navLinks}"
                class="cmp-footer-bar__nav-item">
                <a href="${link.linkUrl @ context='uri'}"
                   class="cmp-footer-bar__nav-link">${link.linkTitle @ context='text'}</a>
            </li>
        </ul>
    </nav>

    <div data-sly-test="${footerBar.socialIcons.size > 0}"
         class="cmp-footer-bar__social">
        <a data-sly-repeat.icon="${footerBar.socialIcons}"
           href="${icon.linkUrl @ context='uri'}"
           class="cmp-footer-bar__social-link"
           target="_blank"
           rel="noopener noreferrer">
            <img src="${icon.iconPath @ context='uri'}"
                 alt=""
                 class="cmp-footer-bar__social-icon"/>
        </a>
    </div>

    <div data-sly-test="${footerBar.legalLinks.size > 0}"
         class="cmp-footer-bar__legal">
        <a data-sly-repeat.legal="${footerBar.legalLinks}"
           href="${legal.linkUrl @ context='uri'}"
           class="cmp-footer-bar__legal-link">${legal.linkTitle @ context='text'}</a>
    </div>

</div>
<sly data-sly-call="${placeholderTemplate.placeholder @ isEmpty=!hasContent}"></sly>
